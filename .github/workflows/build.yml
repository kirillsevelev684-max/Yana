name: Build Yana.exe

# Сборка готового Yana.exe на Windows в облаке GitHub.
# Запускается сама при каждом push в main + вручную (Actions → Run workflow).
# Готовый файл появляется во вкладке Releases. Всё бесплатно.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Проверка синтаксиса
        run: python -m compileall -q Yana.py engine

      - name: Сборка Yana.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Yana
          --add-data "voice_library;voice_library"
          --add-data "assets;assets"
          --exclude-module torch
          --exclude-module scipy
          --exclude-module matplotlib
          Yana.py

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Yana-exe
          path: dist/Yana.exe

      - name: Релиз с готовым .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.${{ github.run_number }}
          name: "Яна 8.0 — готовый .exe (сборка ${{ github.run_number }})"
          body: |
            Готовый Yana.exe — скачай и запусти, ничего ставить не нужно.

            Первый запуск: Windows может показать SmartScreen («неизвестный издатель») —
            это нормально для программ без платной подписи. Нажми «Подробнее» → «Выполнить».
          files: dist/Yana.exe
